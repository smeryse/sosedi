services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sosedi
      POSTGRES_PASSWORD: sosedi
      POSTGRES_DB: sosedi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env.frontend
    ports:
      - "3002:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  minio_data:
  ollama_data:
